<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerador de proposta | Petrocar Mobility</title>
  <style>
    :root{
      --bg:#edf3f9;
      --card:#ffffff;
      --text:#1f2430;
      --muted:#6e7c94;
      --stroke:#d6e0ec;
      --blue:#009fe3;
      --blue2:#355fbd;
      --shadow:0 10px 30px rgba(26,39,68,.08);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#f4f8fc 0%,var(--bg) 100%);color:var(--text)}
    .wrap{max-width:1240px;margin:0 auto;padding:28px 18px 48px}
    .hero{background:var(--card);border:1px solid #e5edf6;border-radius:30px;padding:24px;box-shadow:var(--shadow);margin-bottom:22px}
    h1{margin:0;font-size:28px;line-height:1.1}
    .sub{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.55}
    .grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
    .panel{background:var(--card);border:1px solid #e5edf6;border-radius:28px;padding:22px;box-shadow:var(--shadow)}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    label{font-size:14px;font-weight:700;color:#23314f}
    input,select{width:100%;height:48px;border:1px solid var(--stroke);border-radius:12px;padding:0 14px;font-size:16px;color:var(--text);outline:none;background:#fff}
    input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,159,227,.12)}
    .regionRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .regionBtn{height:48px;border:1px solid var(--stroke);border-radius:14px;background:#fff;color:#294264;font-size:16px;font-weight:800;cursor:pointer;transition:.18s ease}
    .regionBtn.active{background:linear-gradient(90deg,var(--blue),var(--blue2));border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(53,95,189,.18)}
    .regionBtn:not(.active):hover{border-color:#b9cce2;background:#f8fbff}
    .btns{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
    button.action{height:58px;border:0;border-radius:18px;font-size:18px;font-weight:800;cursor:pointer}
    .primary{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff}
    .secondary{background:#eaf1f8;color:#203f84}
    .previewCard{background:var(--card);border:1px solid #e5edf6;border-radius:28px;padding:14px;box-shadow:var(--shadow)}
    .previewWrap{background:#f2f5f8;border-radius:22px;padding:12px;overflow:auto}
    canvas{display:block;width:100%;height:auto;background:#fff;border-radius:18px}
    .helper{margin-top:12px;color:var(--muted);font-size:14px;line-height:1.5}
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
      .wrap{padding:18px 12px 32px}
      .hero,.panel,.previewCard{padding:18px}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Gerador de proposta Petrocar Mobility</h1>
      <p class="sub">Preencha os dados abaixo e gere sua proposta.</p>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="field">
          <label for="cliente">Nome do cliente</label>
          <input id="cliente" type="text" placeholder="Ex.: João da Silva" autocomplete="off" />
        </div>

        <div class="field">
          <label for="data">Data</label>
          <input id="data" type="date" autocomplete="off" />
        </div>

        <div class="field">
          <label>Região</label>
          <div class="regionRow">
            <button class="regionBtn active" type="button" data-regiao="sudeste" id="btnSudeste">Sudeste</button>
            <button class="regionBtn" type="button" data-regiao="nacional" id="btnNacional">Nacional</button>
          </div>
        </div>

        <div class="field">
          <label for="adesao">Adesão</label>
          <select id="adesao">
            <option value="99,90">99,90</option>
            <option value="100">100</option>
            <option value="149,90" selected>149,90</option>
            <option value="150">150</option>
            <option value="199,90">199,90</option>
            <option value="200">200</option>
            <option value="249,90">249,90</option>
            <option value="250">250</option>
          </select>
        </div>

        <div class="field">
          <label for="consultor">Nome do consultor</label>
          <input id="consultor" type="text" placeholder="Ex.: Nome do consultor" autocomplete="off" />
        </div>

        <div class="field">
          <label for="telefone">Telefone do consultor</label>
          <input id="telefone" type="text" placeholder="Ex.: (00) 00000-0000" autocomplete="off" />
        </div>

        <div class="btns">
          <button class="action primary" id="whatsappBtn" type="button">Enviar no WhatsApp</button>
          <button class="action secondary" id="imgBtn" type="button">Baixar imagem</button>
        </div>
      </div>

      <div class="previewCard">
        <div class="previewWrap">
          <canvas id="preview"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf;

    const ASSET_MAP = {
      sudeste: {
        '99,90': 'sudeste-99-90.png',
        '100': 'sudeste-100.png',
        '149,90': 'sudeste-149-90.png',
        '150': 'sudeste-150.png',
        '199,90': 'sudeste-199-90.png',
        '200': 'sudeste-200.png',
        '249,90': 'sudeste-249-90.png',
        '250': 'sudeste-250.png'
      },
      nacional: {
        '99,90': 'nacional-99-90.png',
        '100': 'nacional-100.png',
        '149,90': 'nacional-149-90.png',
        '150': 'nacional-150.png',
        '199,90': 'nacional-199-90.png',
        '200': 'nacional-200.png',
        '249,90': 'nacional-249-90.png',
        '250': 'nacional-250.png'
      }
    };

    const LAYOUT = {
      cliente:   { x: 760,  y: 526,  maxWidth: 370, font: 40, min: 20, color: '#1f2430', weight: 700, align: 'center' },
      data:      { x: 1330, y: 526,  maxWidth: 270, font: 38, min: 20, color: '#1f2430', weight: 700, align: 'center' },
      consultor: { x: 1398, y: 2425, maxWidth: 620, font: 62, min: 26, color: '#25438d', weight: 700, align: 'center' },
      telefone:  { x: 1398, y: 2490, maxWidth: 620, font: 56, min: 24, color: '#25438d', weight: 700, align: 'center' }
    };

    let regiaoAtual = 'sudeste';

    const adesao = document.getElementById('adesao');
    const cliente = document.getElementById('cliente');
    const data = document.getElementById('data');
    const consultor = document.getElementById('consultor');
    const telefone = document.getElementById('telefone');
    const preview = document.getElementById('preview');
    const pctx = preview.getContext('2d');
    const whatsappBtn = document.getElementById('whatsappBtn');
    const imgBtn = document.getElementById('imgBtn');
    const regionBtns = Array.from(document.querySelectorAll('.regionBtn'));

    let baseImage = null;

    function fitFont(ctx, text, maxWidth, startSize, minSize, weight = 700) {
      let size = startSize;
      while (size > minSize) {
        ctx.font = `${weight} ${size}px Arial`;
        if (ctx.measureText(text).width <= maxWidth) return size;
        size -= 1;
      }
      return minSize;
    }

    function drawText(ctx, text, cfg) {
      const value = String(text || '').trim();
      if (!value) return;
      const size = fitFont(ctx, value, cfg.maxWidth, cfg.font, cfg.min, cfg.weight);
      ctx.save();
      ctx.font = `${cfg.weight} ${size}px Arial`;
      ctx.fillStyle = cfg.color;
      ctx.textAlign = cfg.align;
      ctx.textBaseline = 'middle';
      ctx.fillText(value, cfg.x, cfg.y);
      ctx.restore();
    }

    function currentAssetName() {
      return ASSET_MAP[regiaoAtual][adesao.value];
    }

    function formatDateForArtwork(value) {
      if (!value) return '';
      const parts = value.split('-');
      if (parts.length !== 3) return value;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function setTodayIfEmpty() {
      if (!data.value) {
        const now = new Date();
        const offset = now.getTimezoneOffset();
        const local = new Date(now.getTime() - offset * 60000);
        data.value = local.toISOString().slice(0,10);
      }
    }

    async function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function ensureBaseLoaded() {
      const src = currentAssetName();
      if (baseImage && baseImage.datasetSrc === src) return baseImage;
      const img = await loadImage(src);
      img.datasetSrc = src;
      baseImage = img;
      return img;
    }

    async function renderTo(ctx, targetCanvas) {
      const img = await ensureBaseLoaded();
      targetCanvas.width = img.naturalWidth;
      targetCanvas.height = img.naturalHeight;
      ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      ctx.drawImage(img, 0, 0, targetCanvas.width, targetCanvas.height);
      drawText(ctx, cliente.value, LAYOUT.cliente);
      drawText(ctx, formatDateForArtwork(data.value), LAYOUT.data);
      drawText(ctx, consultor.value, LAYOUT.consultor);
      drawText(ctx, telefone.value, LAYOUT.telefone);
    }

    async function draw() {
      setTodayIfEmpty();
      await renderTo(pctx, preview);
    }

    function fileSlug(text) {
      return String(text || 'cliente')
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase().replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'cliente';
    }

    async function exportImage() {
      const exportCanvas = document.createElement('canvas');
      const ectx = exportCanvas.getContext('2d');
      await renderTo(ectx, exportCanvas);

      const filename = `proposta-petrocar-${fileSlug(cliente.value || regiaoAtual)}-${regiaoAtual}-${adesao.value.replace(',', '-')}.png`;

      exportCanvas.toBlob((blob) => {
        if (!blob) {
          alert('Não foi possível gerar a imagem. Tente novamente.');
          return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 3000);
      }, 'image/png');
    }

    function buildPdfFile() {
      const imgData = preview.toDataURL('image/jpeg', 0.82);
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4', compress: true });
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      pdf.addImage(imgData, 'JPEG', 0, 0, pageW, pageH, undefined, 'MEDIUM');

      const filename = `proposta-petrocar-${fileSlug(cliente.value || regiaoAtual)}-${regiaoAtual}-${adesao.value.replace(',', '-')}.pdf`;
      const blob = pdf.output('blob');
      return new File([blob], filename, { type: 'application/pdf' });
    }

    async function sharePdfOnWhatsApp() {
      const file = buildPdfFile();

      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
        try {
          await navigator.share({ files: [file] });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      alert('Seu navegador não permitiu anexar o PDF diretamente. O arquivo foi baixado para você enviar pelo WhatsApp.');
    }

    function setRegiao(novaRegiao) {
      regiaoAtual = novaRegiao;
      regionBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.regiao === novaRegiao));
      baseImage = null;
      draw();
    }

    regionBtns.forEach(btn => {
      btn.addEventListener('click', () => setRegiao(btn.dataset.regiao));
    });

    adesao.addEventListener('change', () => { baseImage = null; draw(); });
    [cliente, consultor, telefone].forEach(el => el.addEventListener('input', draw));
    data.addEventListener('change', draw);
    whatsappBtn.addEventListener('click', sharePdfOnWhatsApp);
    imgBtn.addEventListener('click', exportImage);

    setTodayIfEmpty();
    draw();
  </script>
</body>
</html>
